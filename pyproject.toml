[project]
name = "remnant_classifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "joblib",
    "scikit-learn==1.5.1",
    "bilby",
    "astropy",
    "tqdm"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
remnant_classifier = ["models/*.pkl"]
