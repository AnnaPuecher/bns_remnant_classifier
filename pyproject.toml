[project]
name = "bns_remnant_classifier"
version = "1.0.0"
description = "Classifier for predicting the remnant of binary neutron star mergers from inspiral parameters posteriors and low-latency gravitational-wave data"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Anna Puecher", email = "anna.puecher@ligo.org"}]
keywords = ["gravitational waves", "neutron stars", "remnants", "classifier"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "joblib",
    "scikit-learn==1.4.0",
    "bilby",
    "astropy",
    "tqdm"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
bns_remnant_classifier = [
	"models/*.pkl",
	"eos_ns_properties_default/*.txt",
	"eos_ns_properties_default/MRL_default/*.dat"
]

[project.urls]
Repository = "https://github.com/AnnaPuecher/bns_remnant_classifier"

