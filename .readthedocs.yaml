version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

# Only the documentation toolchain is installed here, not the package's own
# runtime dependencies (numpy, bilby, astropy, scikit-learn, ...) - the
# Sphinx config imports the package straight from source and mocks those
# heavy dependencies out (see autodoc_mock_imports in docs/conf.py), so the
# build stays fast and doesn't need the full scientific stack installed.
python:
  install:
    - requirements: docs/requirements.txt
